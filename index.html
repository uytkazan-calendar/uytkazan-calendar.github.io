  <script>const t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;</script>
  <script>document.addEventListener('DOMContentLoaded',function(){var t=new URLSearchParams(location.search).get('theme');if(!t)return;document.querySelectorAll('a[href]').forEach(function(a){var u=new URL(a.href,location.href);if(u.origin===location.origin&&u.pathname.endsWith('.html')){u.searchParams.set('theme',t);a.href=u.href;}});});</script>
